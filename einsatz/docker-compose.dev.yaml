services:
  postgres:
    image: postgres:16
    container_name: sandkasten-postgres-dev
    environment:
      POSTGRES_DB: sandkasten
      POSTGRES_USER: sandkasten
      POSTGRES_PASSWORD: sandkasten
    ports:
      - "5432:5432"
    volumes:
      - sandkasten-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandkasten -d sandkasten"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles:
      - api
    build:
      context: ..
      dockerfile: einsatz/docker/api.Dockerfile
    image: sandkasten-api:dev
    environment:
      DATABASE_URL: postgres://sandkasten:sandkasten@postgres:5432/sandkasten?sslmode=disable
      SANDKASTEN_API_GRPC_ADDR: ":50051"
      SANDKASTEN_API_HTTP_ADDR: ":8080"
      SANDKASTEN_API_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://diewehmut.github.io"
      SANDKASTEN_API_TOKEN: dev-token
      SANDKASTEN_RUNTIME_LANGUAGES: go,bash,c,cangjie,clojure,cpp,csharp,coq,dart,elixir,fsharp,java,javascript,julia,kotlin,lean4,lua,nextflow,nim,perl,php,prolog,python,r,racket,ruby,rust,scala,sql,swift,typescript,wdl,zig
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  laeufer:
    profiles:
      - runner
    build:
      context: ..
      dockerfile: einsatz/docker/laeufer.Dockerfile
    image: sandkasten-laeufer:dev
    privileged: true
    environment:
      DATABASE_URL: postgres://sandkasten:sandkasten@postgres:5432/sandkasten?sslmode=disable
      LAEUFER_RUNNER_ID: docker-dev
      LAEUFER_WORK_DIR: /var/lib/sandkasten/laeufer
      LAEUFER_POLL_INTERVAL_MS: "1000"
      LAEUFER_LEASE_TTL_MS: "60000"
      LAEUFER_MAX_ARCHIVE_BYTES: "67108864"
      LAEUFER_MAX_ARCHIVE_FILES: "20000"
      LAEUFER_COMPILE_MEMORY_LIMIT_BYTES: "1073741824"
      LAEUFER_PIDS_MAX: "64"
      LAEUFER_MEMORY_SWAP_MAX_BYTES: "0"
      LAEUFER_MAX_ATTEMPTS: "3"
      LAEUFER_RLIMIT_CORE_BYTES: "0"
      LAEUFER_RLIMIT_FSIZE_BYTES: "67108864"
      LAEUFER_RLIMIT_NOFILE: "1024"
      LAEUFER_RLIMIT_NPROC: "64"
      LAEUFER_RLIMIT_STACK_BYTES: "67108864"
      LAEUFER_RLIMIT_MEMLOCK_BYTES: "0"
      LAEUFER_CGROUP_ROOT: /sys/fs/cgroup
      LAEUFER_RUNTIME_PATH: /usr/local/go/bin:/usr/local/bin:/usr/bin:/bin
      LAEUFER_REQUIRE_PRIVATE_NAMESPACES: "1"
      LAEUFER_CHILD_UID: "65534"
      LAEUFER_CHILD_GID: "65534"
    volumes:
      - sandkasten-laeufer:/var/lib/sandkasten/laeufer
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /lib/modules:/lib/modules:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sandkasten-postgres:
  sandkasten-laeufer:
