apiVersion: batch/v1
kind: Job
metadata:
  name: sandkasten-migrate
  namespace: sandkasten
  labels:
    app.kubernetes.io/name: sandkasten-migrate
    app.kubernetes.io/part-of: sandkasten
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandkasten-migrate
        app.kubernetes.io/part-of: sandkasten
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sandkasten-secret
                  key: DATABASE_URL
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -d "$DATABASE_URL"; do
                sleep 2
              done
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /schema/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
      volumes:
        - name: schema
          configMap:
            name: sandkasten-schema
