apiVersion: v1
kind: ConfigMap
metadata:
  name: sandkasten-config
  namespace: sandkasten
  labels:
    app.kubernetes.io/name: sandkasten
    app.kubernetes.io/part-of: sandkasten
data:
  SANDKASTEN_API_GRPC_ADDR: ":50051"
  SANDKASTEN_API_HTTP_ADDR: ":8080"
  SANDKASTEN_API_CORS_ORIGINS: "https://diewehmut.github.io"
  SANDKASTEN_DB_MAX_OPEN_CONNS: "10"
  SANDKASTEN_DB_MAX_IDLE_CONNS: "5"
  SANDKASTEN_DB_CONN_MAX_LIFETIME: "30m"
  SANDKASTEN_EVENT_POLL_INTERVAL: "1s"
  SANDKASTEN_RUNTIME_LANGUAGE: "go"
  SANDKASTEN_RUNTIME_VERSION: "1.26"
  SANDKASTEN_RUNTIME_IMAGE: "sandkasten/go:1.26"
  SANDKASTEN_RUNTIME_REQUIRES_VENDOR: "true"
  SANDKASTEN_RUNTIME_LANGUAGES: "go,bash,c,cangjie,clojure,cpp,csharp,coq,crystal,dart,elixir,fsharp,haskell,java,javascript,julia,kotlin,lean4,lua,mojo,nextflow,nim,perl,php,prolog,python,r,racket,ruby,rust,scala,sql,swift,typescript,wdl,zig"
  LAEUFER_POLL_INTERVAL_MS: "1000"
  LAEUFER_LEASE_TTL_MS: "60000"
  LAEUFER_WORK_DIR: "/var/lib/sandkasten/laeufer"
  LAEUFER_SANDBOX_ROOT: "/var/lib/sandkasten/laeufer/sandbox"
  LAEUFER_CGROUP_ROOT: "/sys/fs/cgroup"
  LAEUFER_RUNTIME_PATH: "/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"
  LAEUFER_MAX_ARCHIVE_BYTES: "67108864"
  LAEUFER_MAX_ARCHIVE_FILES: "20000"
  LAEUFER_COMPILE_MEMORY_LIMIT_BYTES: "1073741824"
  LAEUFER_PIDS_MAX: "64"
  LAEUFER_MEMORY_SWAP_MAX_BYTES: "0"
  LAEUFER_MAX_ATTEMPTS: "3"
  LAEUFER_RLIMIT_CORE_BYTES: "0"
  LAEUFER_RLIMIT_FSIZE_BYTES: "67108864"
  LAEUFER_RLIMIT_NOFILE: "1024"
  LAEUFER_RLIMIT_NPROC: "64"
  LAEUFER_RLIMIT_STACK_BYTES: "67108864"
  LAEUFER_RLIMIT_MEMLOCK_BYTES: "0"
  LAEUFER_REQUIRE_PRIVATE_NAMESPACES: "1"
  LAEUFER_CHILD_UID: "65534"
  LAEUFER_CHILD_GID: "65534"
