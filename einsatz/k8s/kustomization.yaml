apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandkasten
resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-secret.placeholder.yaml
  - 03-postgres.yaml
  - 04-api.yaml
  - 05-laeufer-rbac.yaml
  - 06-laeufer.yaml
  - 07-migrate.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: sandkasten-schema
    files:
      - schema.sql=../../speicher/schema.sql
