apiVersion: v1
kind: Service
metadata:
  name: sandkasten-api
  namespace: sandkasten
  labels:
    app.kubernetes.io/name: sandkasten-api
    app.kubernetes.io/part-of: sandkasten
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
  selector:
    app.kubernetes.io/name: sandkasten-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandkasten-api
  namespace: sandkasten
  labels:
    app.kubernetes.io/name: sandkasten-api
    app.kubernetes.io/part-of: sandkasten
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandkasten-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandkasten-api
        app.kubernetes.io/part-of: sandkasten
    spec:
      serviceAccountName: sandkasten-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/replace-me/sandkasten-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: sandkasten-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sandkasten-secret
                  key: DATABASE_URL
            - name: SANDKASTEN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandkasten-secret
                  key: SANDKASTEN_API_TOKEN
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
