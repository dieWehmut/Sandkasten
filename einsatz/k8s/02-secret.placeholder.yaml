apiVersion: v1
kind: Secret
metadata:
  name: sandkasten-secret
  namespace: sandkasten
  labels:
    app.kubernetes.io/name: sandkasten
    app.kubernetes.io/part-of: sandkasten
type: Opaque
stringData:
  # Replace before applying. The API accepts unauthenticated traffic when this is empty.
  SANDKASTEN_API_TOKEN: "replace-me"
  DATABASE_URL: "postgres://sandkasten:replace-me@sandkasten-postgres.sandkasten.svc.cluster.local:5432/sandkasten?sslmode=disable"
  POSTGRES_DB: "sandkasten"
  POSTGRES_USER: "sandkasten"
  POSTGRES_PASSWORD: "replace-me"
