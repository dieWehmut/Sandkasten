name: Android mobile checks

on:
  push:
    branches: [main, feat/android-mobile-remote]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and verify mobile logic
        run: |
          npm ci
          npm test
          npm run build
          npm run sync
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK and instrumented tests, run lint
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Upload debug installation package
        uses: actions/upload-artifact@v4
        with:
          name: sandkasten-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
