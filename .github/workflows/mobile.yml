name: Android mobile checks

on:
  push:
    branches: [main, feat/android-mobile-remote]
    paths: ['apps/mobile/**', 'schnittstelle/**', 'laeufer/**', 'speicher/schema.sql', '.github/workflows/mobile.yml', '.github/scripts/mobile-native-acceptance.sh']
  pull_request:
    paths: ['apps/mobile/**', 'schnittstelle/**', 'laeufer/**', 'speicher/schema.sql', '.github/workflows/mobile.yml', '.github/scripts/mobile-native-acceptance.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies and verify mobile logic
        run: |
          npm ci
          npm test
          npm run build
          npm run sync
      - name: Build APK and instrumented tests, run lint
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Upload debug installation package
        uses: actions/upload-artifact@v4
        with:
          name: sandkasten-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload instrumented test package
        uses: actions/upload-artifact@v4
        with:
          name: sandkasten-android-tests
          path: apps/mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandkasten-android-lint
          path: apps/mobile/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  native-acceptance:
    name: Installed Android app with real API and sandbox
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: sandkasten
          POSTGRES_PASSWORD: mobile-ci-password
          POSTGRES_DB: mobile_native_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://sandkasten:mobile-ci-password@127.0.0.1:55432/mobile_native_ci?sslmode=disable
      SANDKASTEN_API_TOKEN: mobile-native-ci-token
      SANDKASTEN_API_GRPC_ADDR: 127.0.0.1:55051
      SANDKASTEN_API_HTTP_ADDR: 0.0.0.0:18080
      SANDKASTEN_RUNTIME_VERSION: '1.25'
      MOBILE_E2E_DEVICE: emulator-5554
      MOBILE_E2E_ADDRESS: http://10.0.2.2:18080
      MOBILE_E2E_TOKEN: mobile-native-ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: schnittstelle/go.mod
          cache-dependency-path: schnittstelle/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Download application APK
        uses: actions/download-artifact@v4
        with:
          name: sandkasten-android-debug
          path: .sandkasten/mobile-ci/apks
      - name: Download instrumented test APK
        uses: actions/download-artifact@v4
        with:
          name: sandkasten-android-tests
          path: .sandkasten/mobile-ci/apks
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3
          npm ci --prefix apps/mobile
      - name: Build the real API and Rust sandbox runner
        timeout-minutes: 12
        run: |
          mkdir -p .sandkasten/mobile-ci/evidence
          (cd schnittstelle && go build -trimpath -o ../.sandkasten/mobile-ci/sandkasten-api ./cmd/sandkasten-api) 2>&1 | tee .sandkasten/mobile-ci/evidence/api-build.log
          rustup toolchain install stable --profile minimal
          rustup run stable cargo build --locked --manifest-path laeufer/Cargo.toml --bin laeufer 2>&1 | tee .sandkasten/mobile-ci/evidence/runner-build.log
          rustup run stable cargo test --locked --manifest-path laeufer/Cargo.toml -p laeufer-sandbox --test security_blackbox --no-run --message-format=json > .sandkasten/mobile-ci/evidence/security-test-build.json 2> >(tee .sandkasten/mobile-ci/evidence/security-test-build.log >&2)
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = Path('.sandkasten/mobile-ci/evidence')
          messages = [json.loads(line) for line in (evidence / 'security-test-build.json').read_text().splitlines()]
          executables = [message['executable'] for message in messages
                         if message.get('reason') == 'compiler-artifact'
                         and message['target']['name'] == 'security_blackbox'
                         and message['profile']['test'] and message.get('executable')]
          assert len(executables) == 1, f'Expected one security test binary, got {executables}'
          (evidence / 'security-test-executable.txt').write_text(executables[0] + '\n')
          PY
      - name: Verify backend cancellation and output persistence
        timeout-minutes: 6
        run: |
          (cd schnittstelle && SANDKASTEN_POSTGRES_TEST_URL="$DATABASE_URL" go test ./... -count=1) 2>&1 | tee .sandkasten/mobile-ci/evidence/go-tests.log
          rustup run stable cargo test --locked --manifest-path laeufer/Cargo.toml -p laeufer-core -p laeufer-sandbox -p laeufer-store 2>&1 | tee .sandkasten/mobile-ci/evidence/runner-tests.log
          LAEUFER_STORE_TEST_DATABASE_URL="$DATABASE_URL" rustup run stable cargo test --locked --manifest-path laeufer/Cargo.toml -p laeufer-store --test cancellation_races -- --ignored --nocapture 2>&1 | tee .sandkasten/mobile-ci/evidence/cancellation-race-postgres.log
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run installed-app tests against the real sandbox
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: timeout --signal=TERM --kill-after=20s 12m bash .github/scripts/mobile-native-acceptance.sh
      - name: Preserve real execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandkasten-android-native-acceptance
          path: .sandkasten/mobile-ci/evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
