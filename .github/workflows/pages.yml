name: Deploy WebUI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Test and build WebUI
        working-directory: webui
        run: |
          npm ci
          npm test
          npm run build

      - name: Run responsive browser smoke
        working-directory: webui
        run: npm run test:browser

      - name: Validate WebUI distribution
        shell: bash
        run: |
          SANDKASTEN_BUILD_ALREADY_RUN=1 bash scripts/webui-build-test.sh --test

      - name: Stage WebUI artifact
        shell: bash
        env:
          API_BASE_URL: ${{ vars.SANDKASTEN_API_BASE_URL }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R webui/dist/. _site/
          API_BASE_URL="$API_BASE_URL" python3 - <<'PY' > _site/config.js
          import json
          import os

          api_base_url = os.environ.get("API_BASE_URL", "")
          print(
              "globalThis.SANDKASTEN_CONFIG = { apiBaseUrl: "
              + json.dumps(api_base_url)
              + " };"
          )
          PY
          bash scripts/pages-artifact-test.sh --check _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
