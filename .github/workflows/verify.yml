name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (WebUI, desktop, CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm test` is the documented entry for each app: vitest plus the node
      # test files for the WebUI, `node --test` for the desktop shell and the CLI.
      - name: WebUI tests
        working-directory: apps/web
        run: |
          npm ci
          npm test

      # Neither vitest nor the Vite build looks at the types — both compile
      # through esbuild, which strips them — so the sources get their own step.
      # Test files are out of this config: their doubles still drift from the
      # interfaces and are a pass of their own.
      - name: WebUI types
        working-directory: apps/web
        run: npm run typecheck

      # The same command the Pages workflow runs on the same runner image: it
      # drives the built distribution in a real Chrome at three viewports.
      - name: WebUI browser smoke
        working-directory: apps/web
        run: npm run test:browser

      # The committed distribution is what Pages and the server installer ship.
      # This rebuilds it and checks the four-file contract, which the unit suite
      # leaves out, so a WebUI source change cannot slip through without it. It
      # stops short of comparing the rebuild against the committed bytes: that
      # payload was produced on another platform, and nothing here can prove two
      # platforms emit identical bytes.
      - name: WebUI distribution contract
        shell: bash
        run: bash scripts/webui-build-test.sh --test

      # Repository contracts that need no toolchain beyond git and node: the
      # apps layout and the shape of the Pages artifact. Both are part of the
      # quality gate, so they run before a branch is merged as well.
      - name: Repository contracts
        shell: bash
        run: |
          bash scripts/apps-layout-test.sh
          bash scripts/pages-artifact-test.sh --test

      - name: Desktop unit tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test

      - name: CLI tests
        working-directory: apps/cli
        run: npm test

  machine:
    name: Machine checks (shells, local runtimes, isolated backend)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      # The checks report what this machine can actually do. A toolchain or a
      # backend that is simply absent counts as unavailable; only an installed
      # but broken one fails. The isolated backend needs WSL2, so on this runner
      # it reports itself unavailable instead of failing.
      - name: Desktop machine checks
        working-directory: apps/desktop
        run: |
          npm ci
          npm run verify