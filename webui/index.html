<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sandkasten runner</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <p class="eyebrow">Sandkasten</p>
        <h1>Run source securely</h1>
        <p class="lede">Choose a runtime, submit a source file, and follow the job result.</p>
      </header>

      <form id="run-form" class="runner" novalidate>
        <div class="field">
          <label for="runtime-select">Runtime</label>
          <select id="runtime-select" name="language" required disabled>
            <option value="">Loading runtimes...</option>
          </select>
        </div>

        <div class="field field-source">
          <label for="source">Source</label>
          <textarea id="source" name="source" rows="16" required spellcheck="false" placeholder="Enter source code"></textarea>
        </div>

        <div class="actions">
          <button id="submit-button" type="submit" disabled>Run source</button>
          <button id="cancel-button" type="button" class="secondary" hidden>Stop polling</button>
        </div>
      </form>

      <section class="status-panel" aria-labelledby="status-heading">
        <h2 id="status-heading">Job status</h2>
        <p id="status" role="status" aria-live="polite">Loading runtimes...</p>
        <p id="error" class="message error" role="alert" hidden></p>
      </section>

      <section class="output-grid" aria-labelledby="output-heading">
        <h2 id="output-heading" class="sr-only">Job output</h2>
        <div class="output-panel">
          <h3>Standard output</h3>
          <pre id="stdout" tabindex="0"><code></code></pre>
        </div>
        <div class="output-panel">
          <h3>Standard error</h3>
          <pre id="stderr" tabindex="0"><code></code></pre>
        </div>
        <div class="output-panel output-panel-wide">
          <h3>Diagnostics</h3>
          <pre id="diagnostics" tabindex="0"><code></code></pre>
        </div>
      </section>
    </main>
  </body>
</html>
