syntax = "proto3";

package sandkasten.v1;

import "sandkasten/v1/runtime.proto";

option go_package = "github.com/dieWehmut/sandkasten/schnittstelle/gen/sandkasten/v1;sandkastenv1";

service JobService {
  rpc SubmitGoProject(SubmitGoProjectRequest) returns (SubmitGoProjectResponse);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc StreamJobEvents(StreamJobEventsRequest) returns (stream JobEvent);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
}

message SubmitGoProjectRequest {
  bytes archive_targz = 1;
  string entrypoint = 2;
  bytes stdin = 3;
  repeated string args = 4;
  uint32 compile_timeout_ms = 5;
  uint32 run_timeout_ms = 6;
  uint64 memory_limit_bytes = 7;
  uint32 cpu_millis = 8;
  uint64 max_output_bytes = 9;
  string language = 10;
}

message SubmitGoProjectResponse {
  string job_id = 1;
  JobStatus status = 2;
}

message GetJobRequest {
  string job_id = 1;
}

message StreamJobEventsRequest {
  string job_id = 1;
  uint64 after_sequence = 2;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  string job_id = 1;
  JobStatus status = 2;
}

message Job {
  string job_id = 1;
  JobStatus status = 2;
  string language = 3;
  Runtime runtime = 4;
  string entrypoint = 5;
  repeated string args = 6;
  uint32 compile_timeout_ms = 7;
  uint32 run_timeout_ms = 8;
  uint64 memory_limit_bytes = 9;
  uint32 cpu_millis = 10;
  uint64 max_output_bytes = 11;
  JobResult result = 12;
  string error_message = 13;
  string created_at = 14;
  string started_at = 15;
  string finished_at = 16;
}

message JobResult {
  bytes stdout = 1;
  bytes stderr = 2;
  bytes compile_stdout = 3;
  bytes compile_stderr = 4;
  int32 exit_code = 5;
  int32 signal = 6;
  uint64 wall_time_ms = 7;
  uint64 memory_peak_bytes = 8;
  bool stdout_truncated = 9;
  bool stderr_truncated = 10;
}

message JobEvent {
  string job_id = 1;
  uint64 sequence = 2;
  JobStatus status = 3;
  string message = 4;
  string created_at = 5;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_VALIDATING = 2;
  JOB_STATUS_COMPILING = 3;
  JOB_STATUS_RUNNING = 4;
  JOB_STATUS_SUCCEEDED = 5;
  JOB_STATUS_COMPILE_FAILED = 6;
  JOB_STATUS_RUNTIME_FAILED = 7;
  JOB_STATUS_TIME_LIMIT_EXCEEDED = 8;
  JOB_STATUS_MEMORY_LIMIT_EXCEEDED = 9;
  JOB_STATUS_OUTPUT_LIMIT_EXCEEDED = 10;
  JOB_STATUS_CANCELED = 11;
  JOB_STATUS_SYSTEM_ERROR = 12;
}
